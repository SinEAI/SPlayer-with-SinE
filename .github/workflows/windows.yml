name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Prepare private staging attachments for inspection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Vulkan Runtime
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime_only: true
          cache: true
      - name: Dependencies
        shell: pwsh
        run: |
          ./tools/fetch-deps.ps1
          if (!(Test-Path third_party/mpv/win-x64/vulkan-1.dll)) {
            $runtime = Get-ChildItem 'C:\VulkanSDK' -Recurse -Filter vulkan-1.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (!$runtime) { throw 'Vulkan loader missing' }
            Copy-Item $runtime.FullName third_party/mpv/win-x64/vulkan-1.dll
          }
      - name: Test samples
        shell: pwsh
        run: ./tools/generate-samples.ps1
      - name: Test
        run: dotnet test SPlayer.slnx -c Release -p:Platform=x64 --nologo
      - name: Publish
        run: dotnet publish src/SPlayer.App/SPlayer.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:DebugType=none -o artifacts/publish
      - name: Package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/SPlayer.App/SPlayer.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          if (!(Test-Path artifacts/publish/SPlayer.VisualElementsManifest.xml)) { throw 'Tile manifest missing' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { throw 'Inno Setup install failed' } }
          & $iscc installer/SPlayer.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/SPlayer-$version-win-x64.zip"
          Get-ChildItem artifacts -File | Where-Object Extension -in '.zip','.exe' | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - name: Draft release for final artifact inspection
        if: github.event_name == 'workflow_dispatch' && inputs.draft_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $private = gh api "repos/$env:GH_REPO" --jq .private
          if ($private -ne 'true') { throw 'Inspect packages in a private staging repository before publishing attachments' }
          $version = ([xml](Get-Content src/SPlayer.App/SPlayer.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          $releaseTag = "v$version"
          $packages = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip','.exe' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release create $releaseTag @packages --draft --target $env:GITHUB_SHA --title "SPlayer $releaseTag" --notes "0.1.2.1：新增默认跟随视频比例设置，也可保留上次窗口比例。包含安装包、便携包和 SHA-256。"
          if ($LASTEXITCODE) { throw 'Draft release upload failed' }
